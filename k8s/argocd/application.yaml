apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: kisan-bhai
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/mohammadammar6/kisan-bhai.git
    targetRevision: master
    path: k8s/manifests
    plugin: {}
  destination:
    server: https://kubernetes.default.svc
    namespace: kisan-bhai
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
