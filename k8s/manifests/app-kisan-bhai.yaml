apiVersion: v1
kind: Service
metadata:
  name: kisan-bhai
  namespace: kisan-bhai
spec:
  selector:
    app: kisan-bhai
  ports:
    - name: http
      port: 5000
      targetPort: 5000
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: kisan-bhai
  namespace: kisan-bhai
spec:
  replicas: 1
  selector:
    matchLabels:
      app: kisan-bhai
  template:
    metadata:
      labels:
        app: kisan-bhai
    spec:
      initContainers:
        - name: wait-for-dependencies
          image: busybox:1.36
          command:
            - sh
            - -c
            - until nc -z mysql 3306; do echo 'Waiting for MySQL'; sleep 2; done; until nc -z redis 6379; do echo 'Waiting for Redis'; sleep 2; done
      containers:
        - name: web
          image: devopsusr/kisan-bhai:latest
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 5000
          envFrom:
            - configMapRef:
                name: kisan-bhai-config
          env:
            - name: MYSQL_DATABASE
              valueFrom:
                secretKeyRef:
                  name: kisan-bhai-secrets
                  key: MYSQL_DATABASE
            - name: MYSQL_USER
              valueFrom:
                secretKeyRef:
                  name: kisan-bhai-secrets
                  key: MYSQL_USER
            - name: MYSQL_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: kisan-bhai-secrets
                  key: MYSQL_PASSWORD
            - name: SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: kisan-bhai-secrets
                  key: SECRET_KEY
            - name: OPENWEATHER_API_KEY
              valueFrom:
                secretKeyRef:
                  name: kisan-bhai-secrets
                  key: OPENWEATHER_API_KEY
          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 4
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 30
            periodSeconds: 20
            timeoutSeconds: 4
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              memory: 512Mi
