{% extends "base.html" %}
{% block title %}Crops - KISAN BHAI{% endblock %}
{% block content %}
<h1>Crop Library</h1>
<p class="text-muted">Detailed cultivation guidance for common crops.</p>
<div class="row g-4 mt-1">
{% for crop in crops %}
<div class="col-md-6 col-lg-4">
<div class="card h-100 shadow-sm">
<div class="card-body">
<div class="display-4">{{ crop.emoji }}</div>
<h3>{{ crop.name }}</h3>
<p>{{ crop.description }}</p>
<a class="btn btn-success" href="{{ url_for('crops.detail', crop_id=crop.id) }}">Cultivation plan</a>
</div></div></div>
{% endfor %}
</div>
{% endblock %}
