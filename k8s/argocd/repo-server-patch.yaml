spec:
  template:
    spec:
      automountServiceAccountToken: true
      initContainers:
        - name: download-argocd-vault-plugin
          image: alpine:3.21
          command: ["sh", "-ec"]
          args:
            - |
              apk add --no-cache ca-certificates curl
              case "$(uname -m)" in
                x86_64) arch=amd64 ;;
                aarch64|arm64) arch=arm64 ;;
                *) echo "Unsupported CPU architecture: $(uname -m)" >&2; exit 1 ;;
              esac
              curl -fsSL "https://github.com/argoproj-labs/argocd-vault-plugin/releases/download/v${AVP_VERSION}/argocd-vault-plugin_${AVP_VERSION}_linux_${arch}" -o /custom-tools/argocd-vault-plugin
              chmod 0555 /custom-tools/argocd-vault-plugin
          env:
            - name: AVP_VERSION
              value: "1.18.1"
          volumeMounts:
            - name: avp-tools
              mountPath: /custom-tools
      containers:
        - name: argocd-repo-server
          imagePullPolicy: IfNotPresent
        - name: argocd-vault-plugin
          image: quay.io/argoproj/argocd:v3.5.3
          imagePullPolicy: IfNotPresent
          command: [/var/run/argocd/argocd-cmp-server]
          env:
            - name: VAULT_ADDR
              value: http://vault.vault.svc.cluster.local:8200
            - name: AVP_TYPE
              value: vault
            - name: AVP_AUTH_TYPE
              value: k8s
            - name: AVP_K8S_ROLE
              value: argocd-repo-server
            - name: AVP_KV_VERSION
              value: "2"
          securityContext:
            runAsNonRoot: true
            runAsUser: 999
            allowPrivilegeEscalation: false
          volumeMounts:
            - name: var-files
              mountPath: /var/run/argocd
            - name: plugins
              mountPath: /home/argocd/cmp-server/plugins
            - name: argocd-vault-plugin
              mountPath: /home/argocd/cmp-server/config/plugin.yaml
              subPath: plugin.yaml
            - name: cmp-tmp
              mountPath: /tmp
            - name: avp-tools
              mountPath: /custom-tools
              readOnly: true
      volumes:
        - name: argocd-vault-plugin
          configMap:
            name: argocd-vault-plugin
        - name: cmp-tmp
          emptyDir: {}
        - name: avp-tools
          emptyDir: {}
